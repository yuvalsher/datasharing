<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Abstract tidy data table landscape">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B4F54"/>
      <stop offset="55%" stop-color="#0E6A70"/>
      <stop offset="100%" stop-color="#174B3A"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#F6C177" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F6C177" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#E8F5F6" fill-opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <ellipse cx="1180" cy="220" rx="340" ry="180" fill="url(#glow)"/>

  <!-- Far table plane -->
  <g opacity="0.35" transform="translate(120,180)">
    <rect x="0" y="0" width="520" height="300" rx="18" fill="#062F33"/>
    <g fill="#F6C177">
      <rect x="28" y="28" width="140" height="28" rx="6"/>
      <rect x="188" y="28" width="140" height="28" rx="6"/>
      <rect x="348" y="28" width="140" height="28" rx="6"/>
    </g>
    <g fill="#D7EBED">
      <rect x="28" y="78" width="140" height="28" rx="6"/>
      <rect x="188" y="78" width="140" height="28" rx="6"/>
      <rect x="348" y="78" width="140" height="28" rx="6"/>
      <rect x="28" y="128" width="140" height="28" rx="6"/>
      <rect x="188" y="128" width="140" height="28" rx="6"/>
      <rect x="348" y="128" width="140" height="28" rx="6"/>
      <rect x="28" y="178" width="140" height="28" rx="6"/>
      <rect x="188" y="178" width="140" height="28" rx="6"/>
      <rect x="348" y="178" width="140" height="28" rx="6"/>
      <rect x="28" y="228" width="140" height="28" rx="6"/>
      <rect x="188" y="228" width="140" height="28" rx="6"/>
      <rect x="348" y="228" width="140" height="28" rx="6"/>
    </g>
  </g>

  <!-- Near table plane -->
  <g transform="translate(700,320)">
    <rect x="0" y="0" width="760" height="420" rx="24" fill="#083C40" fill-opacity="0.92"/>
    <g fill="#F6C177">
      <rect x="36" y="36" width="210" height="40" rx="8"/>
      <rect x="270" y="36" width="210" height="40" rx="8"/>
      <rect x="504" y="36" width="210" height="40" rx="8"/>
    </g>
    <g fill="#E8F5F6">
      <rect x="36" y="104" width="210" height="40" rx="8"/>
      <rect x="270" y="104" width="210" height="40" rx="8"/>
      <rect x="504" y="104" width="210" height="40" rx="8"/>
      <rect x="36" y="172" width="210" height="40" rx="8"/>
      <rect x="270" y="172" width="210" height="40" rx="8"/>
      <rect x="504" y="172" width="210" height="40" rx="8"/>
      <rect x="36" y="240" width="210" height="40" rx="8"/>
      <rect x="270" y="240" width="210" height="40" rx="8"/>
      <rect x="504" y="240" width="210" height="40" rx="8"/>
      <rect x="36" y="308" width="210" height="40" rx="8"/>
      <rect x="270" y="308" width="210" height="40" rx="8"/>
      <rect x="504" y="308" width="210" height="40" rx="8"/>
    </g>
  </g>
</svg>
